<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Public View</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
.pcard .gz{display:flex;flex-direction:column;align-items:center;gap:2px}
.pcard .gz h3{font-size:18px}
.pcard .gz .gv{font:800 28px/1 var(--f-head)}
</style>
</helmet>
<div class="pv">

  <div class="head">
    <img class="lg" src="/_blob/20bebcb301e3e494d675c4db884e4189" alt="Let's Balance! A Budget Simulation Game" style="height: 128px; width: auto;">
    <div class="jn">
      <div class="qr" role="img" aria-label="Join code QR placeholder">
        <svg viewBox="0 0 84 84" aria-hidden="true">
          <g fill="#1d4289"><rect x="0" y="0" width="26" height="26"/><rect x="58" y="0" width="26" height="26"/><rect x="0" y="58" width="26" height="26"/></g>
          <g fill="#fff"><rect x="5" y="5" width="16" height="16"/><rect x="63" y="5" width="16" height="16"/><rect x="5" y="63" width="16" height="16"/></g>
          <g fill="#1d4289"><rect x="10" y="10" width="6" height="6"/><rect x="68" y="10" width="6" height="6"/><rect x="10" y="68" width="6" height="6"/><rect x="32" y="4" width="6" height="6"/><rect x="42" y="14" width="6" height="6"/><rect x="32" y="30" width="6" height="6"/><rect x="48" y="34" width="6" height="6"/><rect x="62" y="36" width="6" height="6"/><rect x="74" y="44" width="6" height="6"/><rect x="34" y="50" width="6" height="6"/><rect x="50" y="56" width="6" height="6"/><rect x="62" y="62" width="6" height="6"/><rect x="72" y="72" width="6" height="6"/><rect x="40" y="70" width="6" height="6"/><rect x="4" y="38" width="6" height="6"/><rect x="18" y="44" width="6" height="6"/></g>
        </svg>
      </div>
      <div class="t">
        <span style="font: 700 16px var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.85);">Join with code</span>
        <span class="c">YMKL</span>
      </div>
    </div>
    <div class="clock">
      <span class="ph2">Main Game</span>
      <span class="big" aria-label="Main Game time remaining 42 minutes 49 seconds">42:49</span>
    </div>
  </div>

  <div class="grid">

    <!-- Kent -->
    <div class="pcard">
      <div class="hd"><h2>Kent</h2></div>
      <div class="ppl">
        <span><img src="/_blob/c16cfa6ad48cef3786c949dbebfe68a0" alt="">Admin</span>
        <span><img src="/_blob/ad0807d46fb21d9abb29cf14683f8747" alt="">Comm1 · Chair</span>
        <span><img src="/_blob/ad0807d46fb21d9abb29cf14683f8747" alt="">Comm2</span>
        <span><img src="/_blob/2da48e900e4b09c0aec048904deba2b1" alt="">Speaker1</span>
      </div>
      <div class="fin" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
        <div class="m rv"><span>Revenue</span><b>$101</b></div>
        <div class="m ex"><span>Expenditures</span><b>$107</b></div>
        <div class="m rs"><span>Reserves</span><b>$20</b></div>
      </div>
      <div class="lower">
        <div class="big-status def" role="status"><span>▼</span><div>Deficit $6</div></div>
        <div class="gz">
          <h3>Public Trust</h3>
          <svg viewBox="0 0 200 112" width="220" height="123" role="img" aria-label="Public Trust gauge, slightly positive">
            <path d="M20 100 A80 80 0 0 1 60 30.7" stroke="#f9423a" stroke-width="16" fill="none"/>
            <path d="M60 30.7 A80 80 0 0 1 140 30.7" stroke="#d9e1e2" stroke-width="16" fill="none"/>
            <path d="M140 30.7 A80 80 0 0 1 180 100" stroke="#00966c" stroke-width="16" fill="none"/>
            <circle cx="147" cy="35.3" r="10" fill="#fff" stroke="#252a36" stroke-width="4"/>
          </svg>
          <span class="gv" style="color: var(--forest);">+2</span>
        </div>
      </div>
    </div>

    <!-- Ottawa -->
    <div class="pcard">
      <div class="hd"><h2>Ottawa</h2></div>
      <div class="ppl">
        <span><img src="/_blob/c16cfa6ad48cef3786c949dbebfe68a0" alt="">Admin2</span>
        <span><img src="/_blob/ad0807d46fb21d9abb29cf14683f8747" alt="">Comm5 · Chair</span>
        <span><img src="/_blob/ad0807d46fb21d9abb29cf14683f8747" alt="">Comm6</span>
        <span><img src="/_blob/ad0807d46fb21d9abb29cf14683f8747" alt="">Comm7</span>
        <span><img src="/_blob/2da48e900e4b09c0aec048904deba2b1" alt="">Speaker2</span>
      </div>
      <div class="fin" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
        <div class="m rv"><span>Revenue</span><b>$102</b></div>
        <div class="m ex"><span>Expenditures</span><b>$101</b></div>
        <div class="m rs"><span>Reserves</span><b>$16</b></div>
      </div>
      <div class="lower">
        <div class="big-status sur" role="status"><span>▲</span><div>Surplus $1</div></div>
        <div class="gz">
          <h3>Public Trust</h3>
          <svg viewBox="0 0 200 112" width="220" height="123" role="img" aria-label="Public Trust gauge, slightly negative">
            <path d="M20 100 A80 80 0 0 1 60 30.7" stroke="#f9423a" stroke-width="16" fill="none"/>
            <path d="M60 30.7 A80 80 0 0 1 140 30.7" stroke="#d9e1e2" stroke-width="16" fill="none"/>
            <path d="M140 30.7 A80 80 0 0 1 180 100" stroke="#00966c" stroke-width="16" fill="none"/>
            <circle cx="75.3" cy="23.9" r="10" fill="#fff" stroke="#252a36" stroke-width="4"/>
          </svg>
          <span class="gv" style="color: var(--ink);">−1</span>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
